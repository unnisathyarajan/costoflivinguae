name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm --filter @workspace/uae-salary-check run build
        env:
          PORT: 3000
          BASE_PATH: /
          NODE_ENV: production

      - name: Add 404.html for SPA routing
        run: cp artifacts/uae-salary-check/dist/public/index.html artifacts/uae-salary-check/dist/public/404.html

      - name: Write CNAME
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > artifacts/uae-salary-check/dist/public/CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: artifacts/uae-salary-check/dist/public
          cname: ${{ vars.CUSTOM_DOMAIN }}
